# Attaches a HELMdiel.zip to each release.
#
# GitHub's generated "Source code (zip)" extracts to HELMdiel-<version>/, and
# that prefix is not configurable. Ashita requires the addon's folder name, its
# .lua filename and addon.name to match exactly, so that archive does not load
# until it is renamed by hand. git archive --prefix is the knob GitHub's does
# not expose, and it honors the export-ignore rules in .gitattributes, so the
# shipped file list stays defined in one place rather than repeated here.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # addon.version has named a stale version twice before. A tag disagreeing
      # with it means the zip is mislabelled, so fail before anything publishes.
      - name: Check the tag matches addon.version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          addon_version="$(sed -n "s/^addon\.version *= *'\([^']*\)'.*/\1/p" HELMdiel.lua)"

          if [ -z "$addon_version" ]; then
            echo "Could not read addon.version from HELMdiel.lua." >&2
            exit 1
          fi

          if [ "$tag_version" != "$addon_version" ]; then
            echo "Tag $GITHUB_REF_NAME implies $tag_version, but HELMdiel.lua says $addon_version." >&2
            exit 1
          fi

          echo "Tag and addon.version agree on $addon_version."

      - name: Build HELMdiel.zip
        run: |
          git archive --format=zip --prefix=HELMdiel/ -o HELMdiel.zip HEAD
          unzip -l HELMdiel.zip

          if ! unzip -l HELMdiel.zip | grep -q 'HELMdiel/HELMdiel\.lua'; then
            echo "HELMdiel/HELMdiel.lua is missing from the archive." >&2
            exit 1
          fi

      # Every release body is that version's CHANGELOG section reproduced
      # verbatim, heading included. It is extracted rather than written here so
      # the release page and the changelog cannot say different things.
      - name: Take the release notes from the CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"

          # index($0, hdr) == 1 is a literal starts-with, so the brackets and
          # dots in the version are never interpreted as a regex.
          # The last section is followed by the link definitions rather than by
          # another heading, so those end it too.
          awk -v hdr="## [$version]" '
            index($0, hdr) == 1       { found = 1; print; next }
            found && index($0, "## ") == 1 { exit }
            found && /^\[[^]]*\]: /   { exit }
            found                     { print }
          ' CHANGELOG.md > release-notes.md

          # Trim the blank lines left by the gap before the next heading.
          perl -0777 -pe 's/\s+\z/\n/' release-notes.md > notes.tmp
          mv notes.tmp release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "No '## [$version]' section found in CHANGELOG.md." >&2
            exit 1
          fi

          echo "--- release notes ---"
          cat release-notes.md

      # A release is attributed to whoever's token created it, and the built-in
      # github.token belongs to github-actions[bot]. RELEASE_TOKEN is a personal
      # access token held as a repository secret; with it the release is
      # authored by the account that issued it, and without it this falls back
      # to the bot so the workflow still runs.
      - name: Publish it on the release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"

          # The release already exists when it was cut from the web UI, and does
          # not when the tag was pushed from the command line. Either is fine.
          gh release create "$GITHUB_REF_NAME" \
            --title "HELMdiel $version" \
            --notes-file release-notes.md \
            || echo "Release already exists, uploading to it."

          gh release upload "$GITHUB_REF_NAME" HELMdiel.zip --clobber
